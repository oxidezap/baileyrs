name: Preview Release

# Publish PR/main previews through pkg.pr.new without npm credentials.

on:
  push:
    branches:
      - main
  pull_request:

# Only the selector needs read access to fetch Git history.
permissions:
  contents: read

# Cancel superseded PR previews; preserve a preview for each main commit.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read

  preview:
    permissions: {}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pin actions because their output is installable code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # pkg-pr-new runs prepack, which builds and checks the package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # npm exec uses the pkg-pr-new version pinned in the lockfile. Preview versions cannot satisfy release ranges.
      # --no-template omits the browser sandbox; the Node example needs a WhatsApp WebSocket.
      - name: Publish preview packages
        run: npm exec -- pkg-pr-new publish --previewVersion --no-template
