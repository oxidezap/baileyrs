name: Preview Release

# Publish PR/main previews through pkg.pr.new without npm credentials.

on:
  push:
    branches:
      - main
  pull_request:

# PR code needs no GitHub token permissions.
permissions: {}

# Cancel superseded PR previews; preserve a preview for each main commit.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    name: Publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pin actions because their output is installable code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # pkg-pr-new runs prepack, which builds and checks the package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Use the lockfile tool. Preview versions cannot satisfy release ranges; omit the browser template.
      - name: Publish preview packages
        run: npm exec -- pkg-pr-new publish --previewVersion --no-template
