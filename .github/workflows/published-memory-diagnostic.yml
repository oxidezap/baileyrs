name: Published buffer retention diagnostic
on:
  pull_request:
    paths: ['.github/workflows/published-memory-diagnostic.yml', 'scripts/diagnostics/published-lifetimes.mjs']
permissions:
  contents: read
  id-token: write
concurrency:
  group: published-memory-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  retained:
    name: Published buffer lifetime discriminator
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender@sha256:56cbabbc2bba22a3306bfdf7bf02f0fbd6041483a7cac8b0c6217ac4cfa58f75
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports: ['8080:8080']
        env:
          CHATSTATE_TTL_SECS: '3'
          ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        options: --log-driver none
    env:
      SOCKET_URL: wss://127.0.0.1:8080/ws/chat
      ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      LOG_LEVEL: silent
      BENCH_SUITE: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Prepare original first-DM scenario
        run: |
          npm ls @oxidezap/whatsapp-rust-bridge
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          let source = 'import "../../scripts/diagnostics/published-lifetimes.mjs"\n' + readFileSync('benchmarks/e2e/lifecycle.bench.ts', 'utf8')
          source = source.replace("'bartender/lifecycle'", "'diagnostic/retention/new-buffer-retention'")
          source = source.replace('await settle()', 'await settle(); (globalThis as any).__memoryLifetimes.begin()')
          source = source.replace('afterEach: cleanup', 'afterEach: async () => { (globalThis as any).__memoryLifetimes.end(); await cleanup(); await (globalThis as any).__memoryLifetimes.cleaned() }')
          writeFileSync('benchmarks/e2e/diagnostic-new-buffer-retention.bench.ts', source)
          NODE
      - name: Published buffer lifetime
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f
        env:
          DIAGNOSTIC_LABEL: new-buffer-retention
          DIAGNOSTIC_OBSERVE: '1'
          DIAGNOSTIC_BUFFER_LIFETIME: '1'
        with:
          mode: memory
          runner-version: '5.6.3'
          run: npm run bench -- benchmarks/e2e/diagnostic-new-buffer-retention.bench.ts
      - name: Verify post-cleanup GC record
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs'
          const files = readdirSync('.diagnostic-published')
          if (files.length !== 1) throw Error('expected one buffer-lifetime record')
          const rows = JSON.parse(readFileSync(`.diagnostic-published/${files[0]}`, 'utf8'))
          if (rows.length !== 1 || !rows[0].afterForcedGc || !rows[0].afterCleanupGc) throw Error('incomplete buffer-lifetime record')
          NODE
