name: Bridge flow diagnostic
on:
  pull_request:
    paths: ['.github/workflows/bridge-flow-diagnostic.yml', 'scripts/diagnostics/mock-flow-trace.mjs']
permissions:
  contents: read
concurrency:
  group: bridge-flow-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  trace:
    name: Redacted flow (${{ matrix.bridge }}, ${{ matrix.mock }}, ${{ matrix.suite }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bridge: '0.26.6', mock: adv, suite: reconnect }
          - { bridge: '0.26.4', mock: adv, suite: reconnect }
          - { bridge: '0.26.6', mock: legacy, suite: reconnect }
          - { bridge: '0.26.6', mock: adv, suite: process-restart }
          - { bridge: '0.26.4', mock: adv, suite: process-restart }
          - { bridge: '0.26.6', mock: adv, suite: baileys-handoff }
          - { bridge: '0.26.4', mock: adv, suite: baileys-handoff }
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender@sha256:${{ matrix.mock == 'adv' && '56cbabbc2bba22a3306bfdf7bf02f0fbd6041483a7cac8b0c6217ac4cfa58f75' || '9f9df686b1a70d27d4f2dbb70e28988529be4cda062a5013ab90d8a00e9d78c6' }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports: ['8080:8080']
        env:
          CHATSTATE_TTL_SECS: '3'
          ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        options: --log-driver none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Install published bridge
        env: { BRIDGE_VERSION: '${{ matrix.bridge }}' }
        run: |
          npm install --ignore-scripts --save-exact "@oxidezap/whatsapp-rust-bridge@$BRIDGE_VERSION"
          npm ls @oxidezap/whatsapp-rust-bridge
      - name: Run unchanged scenario with local-label tracing
        env:
          SOCKET_URL: wss://127.0.0.1:8080/ws/chat
          ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          NODE_OPTIONS: --import=./scripts/diagnostics/mock-flow-trace.mjs
          SUITE: ${{ matrix.suite }}
        run: node --expose-gc --test --test-concurrency=1 "src/__tests__/e2e/$SUITE.test-e2e.ts"
  memory-control:
    name: Same-bridge consumer Memory control
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender@sha256:56cbabbc2bba22a3306bfdf7bf02f0fbd6041483a7cac8b0c6217ac4cfa58f75
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports: ['8080:8080']
        env:
          CHATSTATE_TTL_SECS: '3'
          ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        options: --log-driver none
    env:
      SOCKET_URL: wss://127.0.0.1:8080/ws/chat
      ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d9c6ba84d0903ed6e9c24484dc0a9b3c8f392adc
          path: comparison-main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: comparison-main
      - name: Pin only bridge on main
        working-directory: comparison-main
        run: npm install --ignore-scripts --save-exact @oxidezap/whatsapp-rust-bridge@0.26.6
      - name: Prepare identical labeled workloads
        id: prepare
        run: |
          npm ls @oxidezap/whatsapp-rust-bridge
          npm ls --prefix comparison-main @oxidezap/whatsapp-rust-bridge
          sha256sum benchmarks/e2e/lifecycle.bench.ts comparison-main/benchmarks/e2e/lifecycle.bench.ts
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          for (const [root, labels] of [['.', ['consumer-first', 'consumer-second']], ['comparison-main', ['pin-only-before', 'pin-only-after']]]) {
            const source = readFileSync(`${root}/benchmarks/e2e/lifecycle.bench.ts`, 'utf8')
            for (const label of labels) writeFileSync(`${root}/benchmarks/e2e/diagnostic-${label}.bench.ts`, source.replace("'bartender/lifecycle'", `'diagnostic/same-bridge/${label}'`))
          }
          NODE
      - name: Memory pin-only-before
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f
        with:
          mode: memory
          runner-version: '5.6.3'
          working-directory: comparison-main
          run: npm run bench:e2e -- benchmarks/e2e/diagnostic-pin-only-before.bench.ts
      - name: Memory consumer-first
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f
        with:
          mode: memory
          runner-version: '5.6.3'
          working-directory: .
          run: npm run bench:e2e -- benchmarks/e2e/diagnostic-consumer-first.bench.ts
      - name: Memory consumer-second
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f
        with:
          mode: memory
          runner-version: '5.6.3'
          working-directory: .
          run: npm run bench:e2e -- benchmarks/e2e/diagnostic-consumer-second.bench.ts
      - name: Memory pin-only-after
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f
        with:
          mode: memory
          runner-version: '5.6.3'
          working-directory: comparison-main
          run: npm run bench:e2e -- benchmarks/e2e/diagnostic-pin-only-after.bench.ts
