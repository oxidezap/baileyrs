name: Legacy callback latency diagnostic
on:
  pull_request:
    paths: ['.github/workflows/legacy-latency-diagnostic.yml', 'scripts/diagnostics/legacy-latency.mjs']
permissions:
  contents: read
concurrency:
  group: legacy-latency-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  legacy:
    name: Legacy transition control
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender@sha256:56cbabbc2bba22a3306bfdf7bf02f0fbd6041483a7cac8b0c6217ac4cfa58f75
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports: ['8080:8080']
        env:
          CHATSTATE_TTL_SECS: '3'
          ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        options: --log-driver none
    env:
      SOCKET_URL: wss://127.0.0.1:8080/ws/chat
      ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Observe original legacy scenario
        env: { NODE_OPTIONS: '--import=./scripts/diagnostics/legacy-latency.mjs' }
        run: node --expose-gc --test --test-concurrency=1 --test-name-pattern='restores legacy auth' src/__tests__/e2e/process-restart.test-e2e.ts
      - name: Read synthetic transition records
        if: ${{ !cancelled() }}
        run: |
          for trace in .diagnostic-legacy/*.json; do
            if [ -f "$trace" ]; then cat "$trace"; printf '\n'; fi
          done
