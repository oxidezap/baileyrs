name: Bridge version diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/bridge-version-diagnostic.yml'
      - 'scripts/diagnostics/bridge-group-identity.ts'
permissions:
  contents: read
concurrency:
  group: bridge-version-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  group:
    name: Group integration (${{ matrix.bridge }}, ${{ matrix.mock }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bridge: '0.26.4'
            mock: legacy
            image: ghcr.io/whiskeysockets-devtools/bartender@sha256:9f9df686b1a70d27d4f2dbb70e28988529be4cda062a5013ab90d8a00e9d78c6
          - bridge: '0.26.5'
            mock: legacy
            image: ghcr.io/whiskeysockets-devtools/bartender@sha256:9f9df686b1a70d27d4f2dbb70e28988529be4cda062a5013ab90d8a00e9d78c6
          - bridge: '0.26.6'
            mock: legacy
            image: ghcr.io/whiskeysockets-devtools/bartender@sha256:9f9df686b1a70d27d4f2dbb70e28988529be4cda062a5013ab90d8a00e9d78c6
          - bridge: '0.26.6'
            mock: adv
            image: ghcr.io/whiskeysockets-devtools/bartender@sha256:56cbabbc2bba22a3306bfdf7bf02f0fbd6041483a7cac8b0c6217ac4cfa58f75
    services:
      mock-server:
        image: ${{ matrix.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports:
          - 8080:8080
        env:
          CHATSTATE_TTL_SECS: '3'
          ADV_SECRET_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        options: --log-driver none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the exact published comparison package
        env:
          BRIDGE_VERSION: ${{ matrix.bridge }}
        run: |
          npm install --ignore-scripts --save-exact "@oxidezap/whatsapp-rust-bridge@$BRIDGE_VERSION"
          npm ls @oxidezap/whatsapp-rust-bridge
      - name: Run identical native group identity probe
        env:
          SOCKET_URL: 'wss://127.0.0.1:8080/ws/chat'
          ADV_SECRET_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          LOG_LEVEL: debug
        run: node scripts/diagnostics/bridge-group-identity.ts
      - name: Run unchanged group lifecycle and legacy handoff scenarios
        if: always()
        env:
          SOCKET_URL: 'wss://127.0.0.1:8080/ws/chat'
          ADV_SECRET_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          LOG_LEVEL: warn
        run: node --expose-gc --test --test-concurrency=1 src/__tests__/e2e/group-lifecycle.test-e2e.ts src/__tests__/e2e/baileys-handoff.test-e2e.ts
