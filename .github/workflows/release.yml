name: Release

# release-please manages version PRs. Use fix(deps) for runtime upgrades intended for release.
on:
  push:
    branches: [main]
  # Recovery: dispatch with the release tag as the selected ref so npm provenance names the correct commit.
  # Dispatch uses the workflow stored in that tag; tags predating this recovery path cannot use it.
  workflow_dispatch:

permissions:
  contents: read

# Keep a queued release push when another commit lands on main.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    needs: verify-tag
    if: github.event_name == 'push' && needs.verify-tag.outputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # The GITHUB_TOKEN fallback needs Issues permission for release-PR labels.
      issues: write
    steps:
      # Optional RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY enable automatic release-PR checks.
      # The App needs Contents, Pull requests and Issues read/write; GITHUB_TOKEN may require manual CI approval.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Restrict the installation token to the permissions this job needs.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-tag:
    name: Verify the release version
    if: github.event_name == 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify and verify the release commit
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' package.json)
          manifest=$(jq -er '.["."]' .release-please-manifest.json)
          tag="v$version"
          release_sha="$GITHUB_SHA"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$PUSH_BASE" = 0000000000000000000000000000000000000000 ]; then
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$PUSH_BASE"
            previous=$(git show "$PUSH_BASE:.release-please-manifest.json" | jq -er '.["."]')
            if [ "$manifest" = "$previous" ]; then
              exit 0
            fi
            release_sha=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" \
              -f "sha=$GITHUB_SHA" -f path=.release-please-manifest.json -F per_page=1 --jq '.[0].sha')
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          else
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            case "$status" in
              identical | behind) ;;
              *) echo "::error::Release commit is outside main ($status)"; exit 1 ;;
            esac
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Selected tag must be $tag"
              exit 1
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$version" != "$manifest" ]; then
            echo "::error::Expected matching stable package and manifest versions"
            exit 1
          fi
          if ! grep -Fq "## [$version](" CHANGELOG.md; then
            echo "::error::Missing changelog entry for $version"
            exit 1
          fi

          # Create the recovery ref without publishing a GitHub release.
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          if [ "$GITHUB_EVENT_NAME" = push ] && ! gh api "$ref" --silent; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent \
              -f "ref=refs/tags/$tag" -f "sha=$release_sha"
          fi
          object=$(gh api "$ref" --jq .object.sha)
          if [ "$object" != "$release_sha" ]; then
            echo "::error::$tag must identify this exact commit"
            exit 1
          fi
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    name: Verify the release commit
    needs: verify-tag
    if: needs.verify-tag.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets: inherit

  publish:
    name: Publish to npm
    needs: ci
    concurrency:
      group: npm-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment if publication needs approval.
    environment: npm-publish
    permissions:
      contents: read
      # Use short-lived npm OIDC credentials.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs persisted Git credentials.
          persist-credentials: false

      # Download the CI-verified build; do not build next to publish credentials.
      - name: Take the build CI vouched for
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-build
          path: .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Pin npm >=11.5.1 for trusted publishing.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # Verify artifact digests and file set after download.
      - name: Fail unless the tree is byte-for-byte the one CI built
        run: |
          set -euo pipefail
          (cd lib && find . -type f -print0 | sort -z | xargs -0r sha256sum) > lib.actual
          diff -u lib.sha256 lib.actual
          echo "publish: $(wc -l < lib.actual) files match the digests CI recorded"

      # Dependency hooks could obtain OIDC credentials and publish as this package.
      # --ignore-scripts prevents that and preserves the verified build by skipping prepare.
      - run: npm ci --ignore-scripts

      # --ignore-scripts skips prepack, so run its package guard explicitly.
      - run: node scripts/check-pack.ts

      # Run the registry-dependency guard explicitly because hooks are disabled.
      - run: node scripts/check-registry-deps.mjs

      # Trusted publishing handles OIDC and provenance. Publish from the package directory.
      - name: Publish and verify registry integrity
        run: |
          set -euo pipefail
          name=$(jq -er '.name' package.json)
          version=$(jq -er '.version' package.json)
          expected=$(npm pack --ignore-scripts --dry-run --json | jq -er '.[0].integrity')
          registry=https://registry.npmjs.org/
          current=$(npm view "$name@$version" dist.integrity --registry "$registry" --prefer-online 2>/dev/null || true)
          if [ -z "$current" ]; then
            latest=$(npm view "$name" version --registry "$registry" --prefer-online)
            if [ "$latest" = "$version" ] || [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
              echo "::error::Refusing to replace npm latest ($latest) with $version"
              exit 1
            fi
            npm publish --ignore-scripts --registry "$registry"
          fi
          for _ in {1..24}; do
            current=$(npm view "$name@$version" dist.integrity --registry "$registry" --prefer-online 2>/dev/null || true)
            if [ "$current" = "$expected" ]; then
              exit 0
            fi
            if [ -n "$current" ]; then
              echo "::error::The npm package does not match the verified build"
              exit 1
            fi
            sleep 15
          done
          echo "::error::The npm registry has not confirmed $name@$version"
          exit 1

  github-release:
    name: Publish the GitHub release
    needs: [verify-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag moved since verification"
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx false; then
            exit 0
          fi
          notes=$(mktemp)
          awk -v heading="## [${TAG#v}](" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          test -s "$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
      - name: Finalize release PR labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          number=$(jq -ser --arg sha "$GITHUB_SHA" '
            [ .[][] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)
              | select(any(.labels[]; .name == "autorelease: pending" or .name == "autorelease: tagged")) ]
            | if length == 1 then .[0].number else error("Expected one merged release PR") end
          ' <<< "$pulls")
          endpoint="repos/$GITHUB_REPOSITORY/issues/$number/labels"
          if jq -se --argjson number "$number" '
            any(.[][]; .number == $number and any(.labels[]; .name == "autorelease: pending"))
          ' <<< "$pulls" >/dev/null; then
            gh api --silent "$endpoint" -f 'labels[]=autorelease: tagged'
            gh api --silent -X DELETE "$endpoint/autorelease%3A%20pending"
          fi
