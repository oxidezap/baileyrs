name: Release

# release-please keeps a release PR up to date with every conventional commit
# landing on main. Merging that PR tags the release, which is the only thing
# that triggers a publish — so the version bump stays reviewable instead of
# firing on each merge.
#
# Commit types matter now: only feat/fix/perf produce a release. Bumps of the
# bridge dependency used to land as `chore(deps): …`, and a chore-typed commit
# releases nothing — the upgrade would sit on main until an unrelated commit
# dragged it out. Commit those as `fix(deps): …` instead.
on:
  push:
    branches: [main]
  # Recovery path. Only the run that creates a tag carries `release_created`,
  # and re-running it replays the workflow file of that commit — the one that
  # failed. Dispatch this **with the release tag selected as the ref**: npm
  # attests the package to the event's ref and sha, so publishing from a branch
  # with the tag as a parameter would name the wrong commit, and a free-form ref
  # would let a dispatch aim the OIDC job anywhere. A dispatch runs the workflow
  # stored in the selected tag, so this only covers tags created from this
  # commit onwards.
  workflow_dispatch:

permissions:
  contents: read

# One group for every release and recovery run, not one per ref: they have
# different refs, so keying on it would let both reach `npm publish` at once and
# race over which one `latest` ends up pointing at.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please labels the release PR, and PR labels go through the
      # issues API. Only matters on the GITHUB_TOKEN fallback path — the App
      # token below carries its own permissions.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The commit the release was tagged at. Not necessarily the commit that
      # triggered this run: if the run for a release PR merge fails or is
      # superseded, a later push is what creates the release, and the tag then
      # names the earlier merge.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A pull request opened with GITHUB_TOKEN gets its checks queued in an
      # approval-required state, so the release PR sits there until a maintainer
      # clicks "Approve and run". An App installation token is the supported way
      # out: it is minted per run and expires in an hour, unlike the PAT the
      # same workaround used to require.
      #
      # Entirely optional — set the RELEASE_APP_CLIENT_ID variable and the
      # RELEASE_APP_PRIVATE_KEY secret to switch it on. Without them this falls
      # back to GITHUB_TOKEN and releases still work, they just need that click.
      # The App needs Contents, Pull requests and Issues: read and write.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without these the token inherits everything the App installation
          # holds, and job-level `permissions` do not constrain it. Scoping here
          # keeps this token narrow even if the App is later granted more for
          # some other purpose.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Cheap, and first: a dispatch that names something other than a release tag
  # should be refused before a runner spends ten minutes proving the code is
  # fine. Nothing here builds or installs — it reads the tag, the release and
  # the registry.
  verify-tag:
    name: Verify the tag
    needs: release-please
    # `!cancelled()` rather than `always()`: the dispatch path needs this to run
    # past a skipped release-please, but a cancelled run must not go on to
    # publish.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The commit the release was tagged at, by sha rather than by tag name.
      # A name can be retargeted between this checkout and publish's, leaving
      # the two jobs on different trees; a sha cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      # `ref_type == 'tag'` proves the ref is a tag, not that it is a release.
      # Without this, anyone able to push a tag could point the job holding npm
      # OIDC rights at arbitrary code. A GitHub release is what release-please
      # creates and a hand-pushed tag lacks; the version match ties it to the
      # tree; and npm refuses `latest` implicitly once a higher version exists,
      # which would otherwise fail after the whole build.
      - name: Confirm the dispatch targets a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A GitHub release proves nothing on its own: anyone with write access
          # can tag arbitrary code and attach a release record to it by hand.
          # Reachability from main is what ties this commit to the protected
          # branch it had to pass through, so check that first.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *)
              echo "::error::$TAG is at a commit that is not on main ($status)"
              exit 1
              ;;
          esac

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub release; only release tags can be published"
            exit 1
          fi

          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match package.json version $version"
            exit 1
          fi

          name=$(jq -r .name package.json)
          latest=$(npm view "$name" version 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$version" ] &&
             [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::$name@$latest is already published; $version cannot take latest implicitly"
            exit 1
          fi

      # The tag and the sha both come from the same action, so this is a
      # consistency check on it rather than on the event: a mismatch means the
      # release names one commit and this run would ship another.
      - name: Confirm the release tag points at this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          # npm attests the package to the event's sha whatever the workspace
          # holds, so a release tagged at an older commit than the push that
          # created it cannot be published from here without naming a tree that
          # was never built. Refuse; dispatching on the tag has both agree.
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG was tagged at $RELEASE_SHA but this event is $GITHUB_SHA;"
            echo "::error::provenance would name the wrong commit. Dispatch this workflow on $TAG instead."
            exit 1
          fi

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          target=$(jq -r '.object.sha' <<<"$ref")
          if [ "$(jq -r '.object.type' <<<"$ref")" = tag ]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha')
          fi
          if [ "$target" != "$RELEASE_SHA" ]; then
            echo "::error::$TAG points at $target, not $RELEASE_SHA"
            exit 1
          fi

  # The whole bar, not a copy of part of it. This job used to be four steps
  # here — lint, format, tests — which meant a release skipped the e2e suite and
  # the build entirely, and drifted from CI every time CI gained a check.
  #
  # `full: true` turns off the version-bump skip in ci.yml. That skip is what
  # keeps the release pull request's merge from re-running everything; the
  # commit being published is exactly the diff it skips, so this run is the only
  # opinion on it and has to be the complete one.
  #
  # Runs at this event's sha. On the push path `verify-tag` has already refused
  # anything where that is not the tagged commit, and on the dispatch path the
  # ref is the tag.
  ci:
    name: Verify the release commit
    needs: [release-please, verify-tag]
    if: ${{ !cancelled() && needs.verify-tag.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets: inherit

  publish:
    name: Publish to npm
    needs: [release-please, verify-tag, ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate for the publish step: add required reviewers here to make releases
    # need a second pair of eyes, and to scope the OIDC trust on npm.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights. No
      # long-lived NPM_TOKEN lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same immutable commit verify-tag checked out and vouched for. Pinned
          # by sha so retargeting the tag while this job waits on the environment
          # approval cannot change what gets published.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          # Nothing here talks to the remote after checkout, and the steps below
          # run install and pack in a job holding OIDC publish rights. Don't
          # leave the token in .git/config for them.
          persist-credentials: false

      # This job used to run its own `npm run build`, which put the whole
      # toolchain — and every dependency lifecycle script `prepare` reaches —
      # next to the OIDC token, and shipped bytes nothing had checked. It now
      # takes the tree CI built and measured in this same run.
      #
      # Provenance is unaffected: npm attests the workflow, repository, ref and
      # commit of the run that published, and the build happened in a job of
      # this run at this commit.
      - name: Take the build CI vouched for
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-build
          path: .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1, above what some Node 24 releases
      # bundle. Pinned rather than `@latest`: this binary performs the publish
      # with the OIDC token, so it is part of the privileged path and a floating
      # tag would put unreviewed code there.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # An artifact round trip is a zip and an unzip, and neither is something to
      # take on trust when the output is a published version. Same digests, same
      # file set, or nothing is published.
      - name: Fail unless the tree is byte-for-byte the one CI built
        run: |
          set -euo pipefail
          (cd lib && find . -type f -print0 | sort -z | xargs -0r sha256sum) > lib.actual
          diff -u lib.sha256 lib.actual
          echo "publish: $(wc -l < lib.actual) files match the digests CI recorded"

      # `--ignore-scripts` keeps dependency install hooks away from the token:
      # anything they ran here could mint one and publish under this package's
      # identity. It also skips `prepare`, which is the point — the build is the
      # artifact above, not a second one made here.
      - run: npm ci --ignore-scripts

      # `npm publish --ignore-scripts` skips `prepack`, and `prepack` is where
      # the tarball guard lives. Run it directly, on the tree about to be packed,
      # so a build that leaks sourcemaps or duplicate files still fails before
      # anything is published.
      - run: node scripts/check-pack.ts

      # Same reason as above, for the dependency guard: hooks never fire here,
      # so a preview-pinned runtime dependency would otherwise reach the
      # registry. Fails the release until the dependency selects the matching
      # registry release.
      - run: node scripts/check-registry-deps.ts

      # No NODE_AUTH_TOKEN and no --provenance: trusted publishing authenticates
      # over OIDC and attaches provenance on its own. Published from the package
      # directory rather than a prebuilt tarball, which is the shape npm
      # documents provenance against.
      - run: npm publish --ignore-scripts
