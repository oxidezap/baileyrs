name: Release

# release-please manages versions and tags. Use fix(deps) for runtime upgrades intended for release.
on:
  push:
    branches: [main]
  # Recovery: dispatch with the release tag as the selected ref so npm provenance names the correct commit.
  workflow_dispatch:

permissions:
  contents: read

# Serialize all publications so concurrent refs cannot race over npm latest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # The GITHUB_TOKEN fallback needs Issues permission for release-PR labels.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The tagged commit may differ from the push that triggered release creation.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Optional RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY enable automatic release-PR checks.
      # The App needs Contents, Pull requests and Issues read/write; GITHUB_TOKEN may require manual CI approval.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Restrict the installation token to the permissions this job needs.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Validate release identity before building or requesting publish rights.
  verify-tag:
    name: Verify the tag
    needs: release-please
    # Run on dispatch when release-please is skipped, but respect cancellation.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Pin the checkout to a SHA so a retargeted tag cannot change the published tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      # Require a GitHub release, matching package version and valid npm version progression.
      - name: Confirm the dispatch targets a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Also verify release-please ownership; a manually created GitHub release is insufficient.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *)
              echo "::error::$TAG is at a commit that is not on main ($status)"
              exit 1
              ;;
          esac

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub release; only release tags can be published"
            exit 1
          fi

          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match package.json version $version"
            exit 1
          fi

          name=$(jq -r .name package.json)
          latest=$(npm view "$name" version 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$version" ] &&
             [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::$name@$latest is already published; $version cannot take latest implicitly"
            exit 1
          fi

      # Confirm the release tag and action SHA name the same commit.
      - name: Confirm the release tag points at this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          # Event SHA must match the workspace SHA for npm provenance.
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG was tagged at $RELEASE_SHA but this event is $GITHUB_SHA;"
            echo "::error::provenance would name the wrong commit. Dispatch this workflow on $TAG instead."
            exit 1
          fi

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          target=$(jq -r '.object.sha' <<<"$ref")
          if [ "$(jq -r '.object.type' <<<"$ref")" = tag ]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha')
          fi
          if [ "$target" != "$RELEASE_SHA" ]; then
            echo "::error::$TAG points at $target, not $RELEASE_SHA"
            exit 1
          fi

  # Run complete reusable CI, including E2E, on the verified release commit.
  ci:
    name: Verify the release commit
    needs: [release-please, verify-tag]
    if: ${{ !cancelled() && needs.verify-tag.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets: inherit

  publish:
    name: Publish to npm
    needs: [release-please, verify-tag, ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment if publication needs approval.
    environment: npm-publish
    permissions:
      contents: read
      # Use short-lived npm OIDC credentials.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publish the immutable commit verified above.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          # No later step needs persisted Git credentials.
          persist-credentials: false

      # Download the CI-verified build; do not build next to publish credentials.
      - name: Take the build CI vouched for
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-build
          path: .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Pin npm >=11.5.1 for trusted publishing.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # Verify artifact digests and file set after download.
      - name: Fail unless the tree is byte-for-byte the one CI built
        run: |
          set -euo pipefail
          (cd lib && find . -type f -print0 | sort -z | xargs -0r sha256sum) > lib.actual
          diff -u lib.sha256 lib.actual
          echo "publish: $(wc -l < lib.actual) files match the digests CI recorded"

      # Skip lifecycle hooks in the privileged job and preserve the verified build.
      - run: npm ci --ignore-scripts

      # --ignore-scripts skips prepack, so run its package guard explicitly.
      - run: node scripts/check-pack.ts

      # Run the registry-dependency guard explicitly because hooks are disabled.
      - run: node scripts/check-registry-deps.mjs

      # Trusted publishing handles OIDC and provenance. Publish from the package directory.
      - run: npm publish --ignore-scripts
