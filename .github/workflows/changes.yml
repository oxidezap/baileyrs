name: Classify changes

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
    outputs:
      run:
        description: Whether the diff requires checks
        value: ${{ jobs.changes.outputs.run }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Full history avoids API file limits and includes both sides of renames.
      # PRs use their merge base, pushes use the complete before..after range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: decide
        env:
          FULL: ${{ inputs.full }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/changes.mjs
