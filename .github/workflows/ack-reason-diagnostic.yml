name: Published bridge ACK reason diagnostic
on:
  pull_request:
    paths: ['.github/workflows/ack-reason-diagnostic.yml', 'scripts/diagnostics/ack-reason.mjs', 'scripts/diagnostics/mock-stdout-categories.mjs', 'scripts/diagnostics/safe-node-reporter.mjs', 'src/__tests__/e2e/test-client.ts']
permissions:
  contents: read
concurrency:
  group: ack-reason-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reconnect:
    name: Reconnect ${{ matrix.store }} repeat ${{ matrix.repeat }}
    strategy:
      fail-fast: false
      matrix:
        store: [session, other]
        repeat: [1, 2]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender@sha256:56cbabbc2bba22a3306bfdf7bf02f0fbd6041483a7cac8b0c6217ac4cfa58f75
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports: ['8080:8080']
        env:
          CHATSTATE_TTL_SECS: '3'
          ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUST_LOG: warn
          LOG_LEVEL: warn
        options: --log-driver none
    env:
      SOCKET_URL: wss://127.0.0.1:8080/ws/chat
      ADV_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      LOG_LEVEL: silent
      DIAGNOSTIC_REUSABLE_MEMORY: ${{ matrix.store != 'file' && '1' || '0' }}
      DIAGNOSTIC_MEMORY_YIELD: '1'
      DIAGNOSTIC_MEMORY_YIELD_TARGET: alice
      DIAGNOSTIC_MEMORY_YIELD_PHASE: after
      DIAGNOSTIC_MEMORY_YIELD_GROUP: write
      DIAGNOSTIC_MEMORY_YIELD_SCOPE: ${{ matrix.store }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm ls @oxidezap/whatsapp-rust-bridge
      - name: Attach category-only observer
        env:
          MOCK_CONTAINER_ID: ${{ job.services['mock-server'].id }}
        run: |
          mkdir -p .diagnostic-ack
          docker attach --no-stdin --sig-proxy=false "$MOCK_CONTAINER_ID" 2>&1 | node scripts/diagnostics/mock-stdout-categories.mjs > .diagnostic-ack/mock.jsonl &
          printf '%s' "$!" > .diagnostic-ack/filter.pid
      - name: Original reconnect sequence, reusable host memory control
        env:
          NODE_OPTIONS: --import=./scripts/diagnostics/ack-reason.mjs
        run: node --expose-gc --test --test-concurrency=1 --test-reporter=./scripts/diagnostics/safe-node-reporter.mjs src/__tests__/e2e/reconnect.test-e2e.ts
      - name: Read safe observations
        if: ${{ !cancelled() }}
        run: |
          if [ -f .diagnostic-ack/filter.pid ]; then kill "$(cat .diagnostic-ack/filter.pid)" || true; fi
          for trace in .diagnostic-ack/*.jsonl; do
            if [ -f "$trace" ]; then cat "$trace"; fi
          done
