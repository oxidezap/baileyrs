name: autofix.ci

# Requires the autofix.ci GitHub App. It commits oxlint/oxfmt fixes using its own token.
# Keep the workflow name autofix.ci so the App recognizes fix commits.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR fixes; queue main pushes.
concurrency:
  group: autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read

  autofix:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Fix lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # Skip prepare; fixers read source files.
      - run: npm ci --ignore-scripts

      # Run both fixers even if lint has unfixable findings, then report failure.
      - name: Fix auto-fixable lint findings
        id: lint-fix
        continue-on-error: true
        run: npm exec -- oxlint --fix


      - name: Format
        run: npm run format

      # Commit available fixes even if lint failed.
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        if: always()

      # Keep unfixable lint findings red.
      - name: Fail on findings the fixers could not fix
        if: steps.lint-fix.outcome == 'failure'
        run: exit 1
